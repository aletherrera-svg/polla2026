                    <div class="table-responsive">

                                    <th class="text-start">Nombre</th>
                                    <th>Pts Partidos</th>
                                    <th>Pts Goleadores</th>
                                    <th>Total</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-ranking-body"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- PESTAÑA RESULTADOS REALES -->

          { "nombre": "CHRISTIAN LEMUS", "pronosticos": [[null, null], [2, 1]], "goleadores": ["Kylian Mbappé", "Harry Kane", "Erling Haaland", "Luís Díaz", "Vinicius Junior"] }
        ];

        function calcularPuntos() {
            let ranking = participantesData.map(p => {
                let ptsPartidos = 0;
                let ptsGoleadores = 0;

                partidos.forEach(partido => {
                    if (!partido.jugado) return;
                    const pPronostico = p.pronosticos[partido.id];
                    if (!pPronostico) return;

                    const [prLocal, prVisitante] = pPronostico;
                    
                    if (prLocal === null || prLocal === undefined || isNaN(prLocal) || 
                        prVisitante === null || prVisitante === undefined || isNaN(prVisitante)) {
                        return; 
                    }

                    const realResultado = partido.golesLocal > partido.golesVisitante ? 'L' : (partido.golesLocal < partido.golesVisitante ? 'V' : 'E');
                    const prResultado = prLocal > prVisitante ? 'L' : (prLocal < prVisitante ? 'V' : 'E');

                    if (partido.golesLocal === prLocal && partido.golesVisitante === prVisitante) {
                        ptsPartidos += 10;
                    } else if (realResultado === prResultado) {
                        ptsPartidos += 5;
                    }
                });

                p.goleadores.forEach(g => {
                    if (golesGoleadores[g] !== undefined) {
                        ptsGoleadores += golesGoleadores[g] * 5; 
                    }
                });

                return { nombre: p.nombre, ptsPartidos: ptsPartidos, ptsGoleadores: ptsGoleadores, total: ptsPartidos + ptsGoleadores };
            });

            ranking.sort((a, b) => b.total - a.total);
            renderRanking(ranking);
        }

        function renderRanking(ranking) {
            const tbody = document.getElementById("tabla-ranking-body");
            tbody.innerHTML = "";
            ranking.forEach((p, idx) => {
                const tr = document.createElement("tr");
                tr.innerHTML = `<td>${idx + 1}</td><td class="text-start">${p.nombre}</td><td>${p.ptsPartidos}</td><td>${p.ptsGoleadores}</td><td><strong>${p.total}</strong></td>`;
                tbody.appendChild(tr);
            });
        }

        function renderResumen() {
            const list = document.getElementById("partidos-list");
            list.innerHTML = "";
            partidos.forEach(p => {
                const div = document.createElement("div");
                div.className = "col-md-6";
                div.innerHTML = `<div class="p-3 border rounded bg-white text-center"><strong>${p.local}</strong> ${p.golesLocal} - ${p.golesVisitante} <strong>${p.visitante}</strong><br><small class="text-muted">Partido Finalizado</small></div>`;
                list.appendChild(div);
            });
        }

        window.onload = function() {
            calcularPuntos();
            renderResumen();
        };
    </script>
</body>
</html>
